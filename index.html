<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>N2TheStorm | Job Safety Analysis</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f3460">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="N2TheStorm JSA">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div>
        <h1>N2TheStorm</h1>
        <p class="subtitle">Job Safety Analysis</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="newJsaBtn" class="btn-icon" title="New JSA">+</button>
      <button id="savedBtn" class="btn-icon" title="Saved JSAs">📋</button>
    </div>
  </header>

  <main>
    <!-- List view of saved JSAs -->
    <section id="listView" class="view">
      <h2>My JSAs</h2>
      <div id="jsaList" class="jsa-list"></div>
      <button id="startNewBtn" class="btn primary full">Start New JSA</button>
    </section>

    <!-- Form view -->
    <section id="formView" class="view hidden">
      <form id="jsaForm">
        <div class="form-section">
          <h3>Job Information</h3>
          <div class="field">
            <label>Job / Task Name *</label>
            <input type="text" id="jobName" required placeholder="e.g. Electrical Panel Installation">
          </div>
          <div class="field-row">
            <div class="field">
              <label>Location / Site</label>
              <input type="text" id="location" placeholder="Site name or area">
            </div>
            <div class="field">
              <label>Date *</label>
              <input type="date" id="jobDate" required>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Prepared By *</label>
              <input type="text" id="preparedBy" required placeholder="Your name">
            </div>
            <div class="field">
              <label>Supervisor</label>
              <input type="text" id="supervisor" placeholder="Supervisor name">
            </div>
          </div>
        </div>

        <div class="form-section">
          <h3>Required PPE</h3>
          <div class="ppe-grid" id="ppeGrid">
            <label class="ppe-item"><input type="checkbox" value="Hard Hat"> Hard Hat</label>
            <label class="ppe-item"><input type="checkbox" value="Safety Glasses"> Safety Glasses</label>
            <label class="ppe-item"><input type="checkbox" value="Gloves"> Gloves</label>
            <label class="ppe-item"><input type="checkbox" value="Steel Toe Boots"> Steel Toe Boots</label>
            <label class="ppe-item"><input type="checkbox" value="Hi-Vis Vest"> Hi-Vis Vest</label>
            <label class="ppe-item"><input type="checkbox" value="Hearing Protection"> Hearing Protection</label>
            <label class="ppe-item"><input type="checkbox" value="Respirator"> Respirator</label>
            <label class="ppe-item"><input type="checkbox" value="Fall Protection"> Fall Protection</label>
          </div>
          <div class="field">
            <label>Other PPE</label>
            <input type="text" id="otherPpe" placeholder="Additional PPE required">
          </div>
        </div>

        <div class="form-section">
          <div class="section-header">
            <h3>Job Steps & Hazards</h3>
            <button type="button" id="addStepBtn" class="btn small">+ Add Step</button>
          </div>
          <div id="stepsContainer"></div>
        </div>

        <div class="form-section">
          <h3>Additional Notes / Emergency Procedures</h3>
          <textarea id="notes" rows="4" placeholder="Any additional safety notes, emergency contacts, or procedures..."></textarea>
        </div>

        <div class="form-section">
          <h3>Acknowledgment</h3>
          <div class="field">
            <label>Worker Signature (type name)</label>
            <input type="text" id="workerSign" placeholder="Type your full name as signature">
          </div>
          <div class="field">
            <label>Date Signed</label>
            <input type="date" id="signDate">
          </div>
        </div>

        <div class="form-actions">
          <button type="button" id="saveDraftBtn" class="btn secondary">Save Draft</button>
          <button type="button" id="previewBtn" class="btn secondary">Preview</button>
          <button type="submit" class="btn primary">Complete & Export</button>
        </div>
      </form>
    </section>

    <!-- Preview / Report view -->
    <section id="previewView" class="view hidden">
      <div class="preview-header">
        <h2>JSA Report</h2>
        <div>
          <button id="printBtn" class="btn small">Print / PDF</button>
          <button id="backToFormBtn" class="btn small secondary">Edit</button>
        </div>
      </div>
      <div id="reportContent" class="report"></div>
    </section>
  </main>

  <footer>
    <p>N2TheStorm JSA App • For internal use</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
